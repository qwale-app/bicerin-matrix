[workspace]
members = [
    "crates/bicerin-server",
    "crates/bicerin-http",
    "crates/bicerin-auth",
    "crates/bicerin-events",
    "crates/bicerin-rooms",
    "crates/bicerin-sync",
    "crates/bicerin-media",
    "crates/bicerin-storage",
    "crates/bicerin-types",
    "crates/bicerin-config",
    "crates/bicerin-error",
    "crates/bicerin-compat",
    "crates/bicerin-loadgen"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }
hyper = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { version = "1" }
anyhow = { version = "1" }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
mongodb = { version = "3" }
bson = { version = "2", features = ["chrono-0_4"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
config = { version = "0.14" }
clap = { version = "4", features = ["derive", "env"] }
sha2 = { version = "0.10" }
hmac = { version = "0.12" }
hex = { version = "0.4" }
rand = { version = "0.8" }
base64 = { version = "0.22" }
ed25519-dalek = { version = "2" }
moka = { version = "0.12", features = ["future"] }
ruma = { version = "0.10", features = ["client-api", "appservice-api", "push-gateway-api", "server-util", "events"] }
metrics = { version = "0.23" }
metrics-exporter-prometheus = { version = "0.15" }
async-trait = { version = "0.1" }
futures = { version = "0.3" }
bytes = { version = "1" }
http = { version = "1" }
mime = { version = "0.3" }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
serde_yaml = { version = "0.9" }
regex = { version = "1" }
